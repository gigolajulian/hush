<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  .card { width: 1280px; height: 640px; background: #0d0e10; color: #e8e8e6; position: relative; overflow: hidden;
          font-family: "Segoe UI", Inter, system-ui, sans-serif; }
  .icon { position: absolute; right: 64px; top: 56px; width: 128px; height: 128px; }
  .word { position: absolute; left: 112px; top: 216px; font-size: 190px; font-weight: 600; letter-spacing: -6px; line-height: 1; }
  .word i { font-style: normal; color: #00c8dc; }
  .line { position: absolute; left: 122px; top: 448px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 26px; color: #8a8d92; }
  .foot { position: absolute; left: 122px; bottom: 56px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 20px; color: #55585d; letter-spacing: 1px; }
</style></head><body>
<div class="card">
  <svg class="icon" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#1c1e22"/>
    <text x="232" y="380" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-weight="600" font-size="330" fill="#e8e8e6">h</text>
    <circle cx="372" cy="356" r="30" fill="#00c8dc"/>
  </svg>
  <div class="word">hush<i>.</i></div>
  <div class="line">mutes discord while you dictate to claude</div>
  <div class="foot">windows tray helper | mit | github.com/gigolajulian/hush</div>
</div>
</body></html>
